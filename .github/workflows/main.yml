name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "FF_Gaming_Panel" --add-data "assets:assets" src/main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FF-Gaming-Panel-EXE
        path: dist/FF_Gaming_Panel.exe
